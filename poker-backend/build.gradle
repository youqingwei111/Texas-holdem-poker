plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.poker'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

def dotenvTask = tasks.register("dotenv", Copy) {
    description = "Load environment variables from .env file"
    from('.env')
    into("$buildDir/env")
    doLast {
        def envFile = file("$buildDir/env/.env")
        if (envFile.exists()) {
            envFile.readLines().each { line ->
                line = line.trim()
                if (!line.isEmpty() && !line.startsWith('#')) {
                    def parts = line.split('=', 2)
                    if (parts.length == 2) {
                        def key = parts[0].trim()
                        def value = parts[1].trim()
                        project.ext.set(key, value)
                    }
                }
            }
        }
    }
}

processResources {
    dependsOn dotenvTask
    filesMatching("**/application.yml") {
        filter { String content ->
            def envMap = [:]
            try {
                new File(rootDir, '.env').readLines().each { line ->
                    line = line.trim()
                    if (!line.isEmpty() && !line.startsWith('#')) {
                        def parts = line.split('=', 2)
                        if (parts.length == 2) {
                            envMap[parts[0].trim()] = parts[1].trim()
                        }
                    }
                }
            } catch (Exception e) {
                // ignore if .env not found
            }

            content
                .replace('${DB_URL}', envMap['DB_URL'] ?: 'jdbc:mysql://localhost:3306/poker?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false')
                .replace('${DB_USERNAME}', envMap['DB_USERNAME'] ?: 'root')
                .replace('${DB_PASSWORD}', envMap['DB_PASSWORD'] ?: '')
                .replace('${REDIS_HOST}', envMap['REDIS_HOST'] ?: 'localhost')
                .replace('${REDIS_PORT}', envMap['REDIS_PORT'] ?: '6379')
                .replace('${REDIS_DATABASE}', envMap['REDIS_DATABASE'] ?: '0')
                .replace('${JWT_SECRET}', envMap['JWT_SECRET'] ?: 'default_secret_key_at_least_32_characters')
                .replace('${JWT_EXPIRATION}', envMap['JWT_EXPIRATION'] ?: '86400000')
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
}

tasks.named('test') {
    useJUnitPlatform()
}